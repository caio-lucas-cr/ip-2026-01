<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - CRUD Saúde</title>
    <link rel="stylesheet" href="../styles/createAccount.style.css">
</head>

<body>
    <div id="container">
        <header class="page-header">
            <h1>Criar Conta de Usuário</h1>
            <p>Cadastre suas credenciais para gerenciar pacientes e laudos.</p>
        </header>

        <form method="POST" action="/form">
            <div class="field-group">
                <label>Nome completo</label>
                <input name="username" placeholder="Digite o seu nome" type="text" required>
            </div>
            <div class="field-group">
                <label>E-mail</label>
                <input name="email" placeholder="Digite o seu e-mail" type="email" required>
            </div>
            <div class="field-group">
                <label>Data de nascimento</label>
                <input name="bornDate" type="date" required>
            </div>
            <div class="field-group">
                <label>Senha</label>
                <input name="password" placeholder="Digite a sua senha" type="password" required>
            </div>

            <button type="submit"><span>Concluir Cadastro</span></button>
        </form>

        <footer class="page-footer">
            <a href="/index.html">Voltar ao Dashboard</a>
            <a href="/forms/login.html">Já tenho conta</a>
        </footer>
    </div>
</body>

</html>
