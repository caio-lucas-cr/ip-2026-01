<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Laudo - Saúde</title>
    <link rel="stylesheet" href="/styles/createPatient.style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>🏥 Editar Laudo Médico</h1>
            <ul>
                <li><a href="/index.html">Início</a></li>
                <li><a href="/patients">Pacientes</a></li>
            </ul>
        </nav>

        <main class="content">
            <div class="form-container">
                <h2>Editar Laudo Médico</h2>
                <form method="POST" action="/editMedicalReport?reportID={{.ID}}" class="patient-form">
                    <div class="form-group">
                        <label for="doctor">Médico Responsável:</label>
                        <input type="text" id="doctor" name="doctor" value="{{.Doctor}}" placeholder="Ex: Dr. Carlos Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="title">Título do Laudo:</label>
                        <input type="text" id="title" name="title" value="{{.Title}}" placeholder="Ex: Consulta de Rotina" required>
                    </div>

                    <div class="form-group">
                        <label for="content">Conteúdo do Laudo:</label>
                        <textarea id="content" name="content" placeholder="Descreva o diagnóstico, observações e recomendações..." rows="8" required>{{.Content}}</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        <a href="/patientDetail?id={{.PatientID}}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
