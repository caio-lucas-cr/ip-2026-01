<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente - Saúde</title>
    <link rel="stylesheet" href="/styles/createPatient.style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>🏥 Editar Paciente</h1>
            <ul>
                <li><a href="/index.html">Início</a></li>
                <li><a href="/patients">Pacientes</a></li>
            </ul>
        </nav>

        <main class="content">
            <div class="form-container">
                <h2>Editar Dados do Paciente</h2>
                <form method="POST" action="/updatePatient?id={{.ID}}" class="patient-form">
                    <div class="form-group">
                        <label for="name">Nome Completo:</label>
                        <input type="text" id="name" name="name" value="{{.Name}}" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="Ex: joao@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" value="{{.CPF}}" placeholder="Ex: 123.456.789-00" required>
                    </div>

                    <div class="form-group">
                        <label for="bornDate">Data de Nascimento:</label>
                        <input type="date" id="bornDate" name="bornDate" value="{{.BornDate}}" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefone:</label>
                        <input type="tel" id="phone" name="phone" value="{{.Phone}}" placeholder="Ex: (11) 98765-4321" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Endereço:</label>
                        <textarea id="address" name="address" placeholder="Ex: Rua das Flores, 123, São Paulo - SP" rows="4" required>{{.Address}}</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                        <a href="/patientDetail?id={{.ID}}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
